name: Publish to npm

# Auto-publish the `bagidea-office` npm bootstrapper on each release. Only publishes
# when npm/package.json carries a version that isn't on the registry yet, so a
# release that didn't bump the bootstrapper is a clean no-op.
#
# ── AUTH: token in a GitHub secret ───────────────────────────────────────────
# The job is GATED behind the repo variable `ENABLE_NPM_PUBLISH` (set to `true`)
# and authenticates with the `NPM_TOKEN` secret (a granular npm token with
# read+write on this package). If the secret is ever removed the publish step
# errors clearly rather than pretending to work.
#
# Turn OFF cleanly: set repo variable ENABLE_NPM_PUBLISH to anything but `true`
# (or delete it) → the job skips grey, never a red ✗.
# Rotate the token: `gh secret set NPM_TOKEN --repo bagidea/bagidea-office`
# (or repo Settings → Secrets and variables → Actions), paste the new token.
#
# More secure alternative (no stored token): npm Trusted Publishing (OIDC).
# Configure a Trusted Publisher for the package on npmjs.com (repo + this workflow
# file), give the job `permissions: id-token: write`, drop the NODE_AUTH_TOKEN env,
# and revoke NPM_TOKEN. Left as token auth per the owner's choice.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Clean skip (not a red ✗) unless explicitly enabled. Flip the repo variable
    # ENABLE_NPM_PUBLISH to turn publishing on/off.
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Skip if this version is already on npm
        id: check
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "bagidea-office@$V" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "bagidea-office@$V is already published — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Will publish bagidea-office@$V."
          fi
      - name: Publish
        if: steps.check.outputs.already == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
