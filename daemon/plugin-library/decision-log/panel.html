<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧠 Decision Log</title>
<style>
  :root { --bg:#0c1322; --fg:#dbe7ff; --dim:#7e8db0; --accent:#5ec8ff; --card:#13203a; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI','Leelawadee UI',Tahoma,'Noto Sans Thai',system-ui,sans-serif; }
  body { background:var(--bg); color:var(--fg); padding:14px; font-size:12.5px; }
  h1 { font-size:15px; margin-bottom:10px; }
  .add { display:flex; flex-direction:column; gap:6px; background:var(--card); border-radius:10px; padding:10px; margin-bottom:12px; }
  input, textarea { background:#0a1020; color:var(--fg); border:1px solid rgba(255,255,255,.12); border-radius:7px; padding:7px 9px; font:inherit; }
  button { background:rgba(94,200,255,.12); border:1px solid rgba(94,200,255,.4); color:var(--fg); border-radius:8px; padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  .d { background:var(--card); border-radius:10px; padding:10px; margin-bottom:8px; border-left:3px solid var(--accent); }
  .d.off { opacity:.5; border-left-color:#555; }
  .d .why { color:var(--dim); margin-top:3px; }
  .d .m { color:var(--dim); font-size:10.5px; margin-top:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chain { font-size:10.5px; color:var(--dim); }
</style></head><body>
<h1>🧠 Decision Log</h1>
<div class="add">
  <input id="what" placeholder="We decided… (what)">
  <input id="why" placeholder="…because (why)">
  <div style="display:flex;gap:6px;align-items:center"><button id="add">＋ Record</button><span class="chain">Active decisions reach the agents that opted in (agent editor → 🧠 MEMORY PLUGINS).</span></div>
</div>
<div id="list"></div>
<script>
  const BASE = "/plugin/decision-log";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const cmd = (name, args) => fetch(BASE + "/cmd", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ cmd: name, args }) }).then((r) => r.json());
  async function load() {
    const j = await fetch(BASE + "/list").then((r) => r.json());
    const box = document.getElementById("list"); box.innerHTML = "";
    if (!j.decisions.length) box.innerHTML = '<div class="chain">No decisions yet. Record one above, or tell an agent: "log the decision: … because …".</div>';
    for (const d of j.decisions) {
      const el = document.createElement("div"); el.className = "d" + (d.active ? "" : " off");
      el.innerHTML = `<div><b>${esc(d.what)}</b></div><div class="why">because ${esc(d.why || "—")}</div>
        <div class="m"><span>${new Date(d.at).toLocaleString()} · ${esc(d.by)} · ${d.id}</span>
        ${d.supersedes ? `<span class="chain">↑ supersedes ${d.supersedes}</span>` : ""}${d.supersededBy ? `<span class="chain">↓ superseded by ${d.supersededBy}</span>` : ""}
        ${d.active ? `<button data-s="${d.id}">↻ supersede</button><button data-r="${d.id}">retire</button>` : ""}</div>`;
      box.appendChild(el);
    }
    box.querySelectorAll("[data-r]").forEach((b) => b.onclick = () => cmd("retire", b.dataset.r).then(load));
    box.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => {
      const what = prompt("New decision (what)?"); if (!what) return;
      const why = prompt("Because (why)?") || "";
      cmd("supersede", `${b.dataset.s} :: ${what} :: ${why}`).then(load);
    });
  }
  document.getElementById("add").onclick = () => {
    const what = document.getElementById("what").value.trim(); if (!what) return;
    cmd("add", `${what} :: ${document.getElementById("why").value.trim()}`).then(() => { document.getElementById("what").value = ""; document.getElementById("why").value = ""; load(); });
  };
  load();
  try { const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"); ws.onmessage = (m) => { try { const e = JSON.parse(m.data); if (e.type === "plugin.event" && e.plugin === "decision-log") load(); } catch {} }; } catch {}
</script></body></html>
