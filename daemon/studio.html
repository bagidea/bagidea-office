<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Studio — BagIdea Office</title>
<style>
  :root { --bg:#0a111d; --card:#0e1626; --line:rgba(255,255,255,.10); --accent:#5ec8ff; --text:#e8eef6; --dim:#90a0b6; --warn:#ffcf8a; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font:13px/1.55 -apple-system,Segoe UI,Roboto,"Noto Sans Thai",sans-serif; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:rgba(94,200,255,.35); border-radius:8px; }
  .wrap { max-width:820px; margin:0 auto; padding:18px 18px 50px; }
  h1 { font-size:19px; margin:4px 0 2px; }
  .intro { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 15px;
    margin:10px 0 16px; font-size:12.5px; color:#cdd9e8; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 15px; margin-bottom:12px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .card p.sub { color:var(--dim); margin:0 0 10px; font-size:12.3px; }
  textarea, input[type=text] { width:100%; background:#0a1020; border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 10px; font:12.5px/1.5 inherit; resize:vertical; }
  textarea { min-height:56px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:9px; flex-wrap:wrap; }
  button { background:#13203a; color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:7px 14px; cursor:pointer; font-weight:600; font-size:12px; white-space:nowrap; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button.go { background:#0e4d8c; border-color:rgba(94,200,255,.5); }
  button.go:hover:not(:disabled) { background:#1466b3; color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  select { background:#0a1020; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 9px; font-size:12px; }
  .status { font-size:11.5px; color:var(--dim); min-height:16px; margin-top:8px; }
  .status.err { color:#ff9b9b; }
  .status.warn { color:var(--warn); }
  .pricetag { font-size:11px; color:var(--warn); border:1px solid rgba(255,207,138,.4); border-radius:999px; padding:2px 8px; }
  .sec { font-size:12px; color:var(--dim); margin:20px 0 8px; letter-spacing:.4px; text-transform:uppercase; }
  .gal { display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:9px; }
  .tile { position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden;
    background:#0a1020; cursor:pointer; aspect-ratio:1; }
  .tile.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .tile img, .tile video { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .tag { position:absolute; left:5px; bottom:5px; font-size:10px; background:rgba(10,17,29,.8);
    border-radius:5px; padding:1px 6px; color:var(--dim); }
  .picked { display:flex; gap:9px; align-items:center; margin-top:9px; font-size:12px; color:var(--dim); }
  .picked img { width:52px; height:52px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .empty { color:var(--dim); font-size:12.3px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 <span id="tTitle">Media Studio</span></h1>
  <div class="intro" id="intro"></div>

  <div class="card">
    <h3 id="tMakeT">🖼 สร้างภาพ</h3>
    <p class="sub" id="tMakeD"></p>
    <textarea id="mkPrompt" placeholder="a low-poly voxel castle at golden hour, soft rim light"></textarea>
    <div class="row"><button class="go" id="mkBtn">🖼 <span id="tMakeB">สร้าง</span></button></div>
    <div class="status" id="mkStatus"></div>
  </div>

  <div class="card">
    <h3 id="tEditT">✏️ แก้ภาพเดิม</h3>
    <p class="sub" id="tEditD"></p>
    <div class="picked" id="edPicked"></div>
    <textarea id="edPrompt" placeholder="make the sky darker and add fog at the base"></textarea>
    <div class="row"><button class="go" id="edBtn">✏️ <span id="tEditB">แก้</span></button></div>
    <div class="status" id="edStatus"></div>
  </div>

  <div class="card">
    <h3 id="tVidT">🎬 ทำวิดีโอ</h3>
    <p class="sub" id="tVidD"></p>
    <textarea id="vdPrompt" placeholder="slow push-in on the castle, torches flickering"></textarea>
    <div class="row">
      <select id="vdRatio">
        <option value="16:9">16:9</option>
        <option value="9:16">9:16</option>
        <option value="1:1">1:1</option>
      </select>
      <button class="go" id="vdBtn">🎬 <span id="tVidB">สร้างวิดีโอ</span></button>
      <span class="pricetag" id="tVidPrice"></span>
    </div>
    <div class="status" id="vdStatus"></div>
  </div>

  <div class="sec" id="tGal">ที่ทำไว้แล้ว</div>
  <div class="gal" id="gal"></div>
  <p class="empty" id="galEmpty"></p>
</div>

<script src="/winlang.js"></script>
<script>
  // Same webview rule as the other hub windows: a target="_blank" would navigate
  // this page, so external links go out through the daemon instead.
  document.addEventListener("click", (e) => {
    const a = e.target && e.target.closest && e.target.closest("a[href]");
    if (!a || !/^https?:/.test(a.getAttribute("href") || "")) return;
    e.preventDefault();
    fetch("/open", { method: "POST",
      headers: { "content-type": "application/json", "x-bagidea-ui": "1" },
      body: JSON.stringify({ path: a.getAttribute("href") }) }).catch(() => {});
  });

  let L = "th", WL = null;
  const UI = {
    th: {
      title: "Media Studio",
      intro: "ห้องสร้างสื่อของออฟฟิศ — ทำภาพใหม่ แก้ภาพเดิม แล้วทำให้มันขยับ ทุกอย่างเซฟลงโฟลเดอร์ uploads ของ workspace ใช้ต่อในแชทหรือในโปรเจกต์ได้เลย",
      makeT: "🖼 สร้างภาพ", makeD: "พิมพ์ว่าอยากได้ภาพอะไร (ภาษาอังกฤษได้ผลดีกว่า)", makeB: "สร้าง",
      editT: "✏️ แก้ภาพเดิม", editD: "เลือกภาพจากด้านล่างก่อน แล้วบอกว่าจะแก้อะไร — ภาพเดิมไม่ถูกทับ ได้เป็นไฟล์ใหม่เสมอ", editB: "แก้",
      vidT: "🎬 ทำวิดีโอ", vidD: "ทำจากข้อความ หรือเลือกภาพด้านล่างไว้เป็นเฟรมแรกก็ได้ · ใช้เวลาหลายนาที", vidB: "สร้างวิดีโอ",
      vidPrice: "≈ $2 ต่อคลิป",
      gal: "ที่ทำไว้แล้ว", galEmpty: "ยังไม่มีอะไรเลย — ลองสร้างภาพสักอันดูก่อน",
      pickNone: "ยังไม่ได้เลือกภาพ (กดที่ภาพด้านล่าง)", pickOne: "ใช้ภาพนี้",
      working: "กำลังทำ… อาจใช้เวลาสักครู่", vidWorking: n => "กำลังสร้างวิดีโอ… " + n + " วินาทีแล้ว (ปกติ 1–3 นาที)",
      needPrompt: "พิมพ์ก่อนว่าอยากได้อะไร", needPick: "เลือกภาพที่จะแก้ก่อน",
      done: "✓ เสร็จแล้ว", failed: "⚠ ",
    },
    en: {
      title: "Media Studio",
      intro: "The office's media room — make a picture, change one, then make it move. Everything lands in the workspace uploads folder, ready to use in chat or in a project.",
      makeT: "🖼 Make a picture", makeD: "Describe what you want (English tends to work better)", makeB: "Make",
      editT: "✏️ Change a picture", editD: "Pick one below, then say what to change — the original is never overwritten, you always get a new file", editB: "Change",
      vidT: "🎬 Make a video", vidD: "From text, or pick a picture below to use as the first frame · takes several minutes", vidB: "Make video",
      vidPrice: "≈ $2 per clip",
      gal: "Made so far", galEmpty: "Nothing yet — try making a picture first",
      pickNone: "No picture picked (tap one below)", pickOne: "using this one",
      working: "Working… this can take a moment", vidWorking: n => "Generating… " + n + "s so far (usually 1–3 minutes)",
      needPrompt: "Say what you want first", needPick: "Pick a picture to change first",
      done: "✓ Done", failed: "⚠ ",
    },
  };
  const t = (k) => (UI[L] && UI[L][k]) || UI.en[k] || UI.th[k];

  let items = [], picked = null;

  function paint() {
    document.getElementById("tTitle").textContent = t("title");
    document.getElementById("intro").textContent = t("intro");
    for (const [id, k] of [["tMakeT","makeT"],["tMakeD","makeD"],["tMakeB","makeB"],
                           ["tEditT","editT"],["tEditD","editD"],["tEditB","editB"],
                           ["tVidT","vidT"],["tVidD","vidD"],["tVidB","vidB"],
                           ["tVidPrice","vidPrice"],["tGal","gal"]]) {
      const el = document.getElementById(id);
      if (el) el.textContent = t(k);
    }
    paintPicked();
    paintGal();
  }
  function paintPicked() {
    const el = document.getElementById("edPicked");
    el.innerHTML = picked
      ? `<img src="${picked}" alt=""><span>${t("pickOne")}</span>`
      : `<span>${t("pickNone")}</span>`;
  }
  function paintGal() {
    const g = document.getElementById("gal"), e = document.getElementById("galEmpty");
    e.textContent = items.length ? "" : t("galEmpty");
    g.innerHTML = items.map((it) => it.kind === "video"
      ? `<div class="tile" data-url="${it.url}" data-kind="video"><video src="${it.url}" muted playsinline></video><span class="tag">mp4</span></div>`
      : `<div class="tile${picked === it.url ? " on" : ""}" data-url="${it.url}" data-kind="image"><img src="${it.url}" alt=""><span class="tag">png</span></div>`
    ).join("");
    g.querySelectorAll(".tile").forEach((el) => {
      el.onclick = () => {
        if (el.dataset.kind === "video") { const v = el.querySelector("video"); v.paused ? v.play() : v.pause(); return; }
        // Tapping the picked one again lets go of it, so there is always a way
        // back to "no picture" without reloading.
        picked = picked === el.dataset.url ? null : el.dataset.url;
        paintPicked(); paintGal();
      };
    });
  }

  function say(id, msg, cls) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = "status" + (cls ? " " + cls : "");
  }
  async function refresh() {
    try {
      const r = await fetch("/studio/list");
      items = (await r.json()).items || [];
    } catch { items = []; }
    paintGal();
  }
  // The daemon answers errors as plain text; showing it beats "something failed".
  async function callJson(url, body, opts = {}) {
    const r = await fetch(url, { method: opts.method || "POST",
      headers: { "content-type": "application/json", ...(opts.ui ? { "x-bagidea-ui": "1" } : {}) },
      body: body ? JSON.stringify(body) : undefined });
    const text = await r.text();
    if (!r.ok) throw new Error(text || ("HTTP " + r.status));
    try { return JSON.parse(text); } catch { return {}; }
  }
  function busy(btnId, on) { document.getElementById(btnId).disabled = on; }

  document.getElementById("mkBtn").onclick = async () => {
    const prompt = document.getElementById("mkPrompt").value.trim();
    if (!prompt) return say("mkStatus", t("needPrompt"), "warn");
    busy("mkBtn", true); say("mkStatus", t("working"));
    try {
      const out = await callJson("/gen/image", { prompt });
      picked = out.url;                       // ready to iterate on straight away
      say("mkStatus", t("done"));
      await refresh(); paintPicked();
    } catch (e) { say("mkStatus", t("failed") + e.message, "err"); }
    busy("mkBtn", false);
  };

  document.getElementById("edBtn").onclick = async () => {
    const prompt = document.getElementById("edPrompt").value.trim();
    if (!picked) return say("edStatus", t("needPick"), "warn");
    if (!prompt) return say("edStatus", t("needPrompt"), "warn");
    busy("edBtn", true); say("edStatus", t("working"));
    try {
      const out = await callJson("/gen/image/edit", { url: picked, prompt });
      picked = out.url;                       // chain edits without re-picking
      say("edStatus", t("done"));
      await refresh(); paintPicked();
    } catch (e) { say("edStatus", t("failed") + e.message, "err"); }
    busy("edBtn", false);
  };

  document.getElementById("vdBtn").onclick = async () => {
    const prompt = document.getElementById("vdPrompt").value.trim();
    if (!prompt) return say("vdStatus", t("needPrompt"), "warn");
    busy("vdBtn", true);
    const t0 = Date.now();
    say("vdStatus", t("vidWorking")(0));
    try {
      const started = await callJson("/gen/video",
        { prompt, url: picked || undefined, aspectRatio: document.getElementById("vdRatio").value },
        { ui: true });
      // Minutes, not seconds: poll and keep saying how long it has been, so an
      // eventual failure never looks like the window froze.
      for (;;) {
        await new Promise((r) => setTimeout(r, 10000));
        say("vdStatus", t("vidWorking")(Math.round((Date.now() - t0) / 1000)));
        const st = await callJson("/gen/video?op=" + encodeURIComponent(started.op), null, { method: "GET" });
        if (st.done) { say("vdStatus", t("done")); await refresh(); break; }
      }
    } catch (e) { say("vdStatus", t("failed") + e.message, "err"); }
    busy("vdBtn", false);
  };

  // Language follows the office. Beyond th/en the strings are translated at
  // runtime like the other hub windows; the two function-valued ones stay
  // English rather than being mangled by a template-unaware translator.
  async function boot() {
    try {
      const reg = await (await fetch("/registry")).json();
      const lang = reg.lang || "th";
      if (lang !== "th") L = lang;
      if (lang !== "th" && lang !== "en" && window.WinLang) {
        WL = await WinLang.build(lang);
        const thai = Object.values(UI.th).filter((v) => typeof v === "string");
        const apply = () => {
          UI[lang] = {};
          for (const k in UI.th) UI[lang][k] = (typeof UI.th[k] === "function")
            ? UI.en[k] : (WL.map[UI.th[k]] || UI.en[k] || UI.th[k]);
        };
        apply();
        WL.ensure(thai, () => { apply(); paint(); });
      }
    } catch {}
    paint();
    refresh();
  }
  boot();
</script>
</body>
</html>
